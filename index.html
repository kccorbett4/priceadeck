          "acceptedAnswer": { "@type": "Answer", "text": "Composite is cheaper long-term if you keep the deck 15+ years. A $9,000 pressure-treated deck costs $200–$400/yr in stain, sealer, and board replacement — roughly $6,000 over 20 years. A $16,000 composite deck costs $50/yr in cleaning. Total 20-year cost: wood ~$15,000, composite ~$17,000 — but composite still looks new at year 20." }
        },

          "name": "Do I need a permit for a new deck?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes — most US municipalities require a building permit for any deck over 30 inches off the ground or attached to the house. Permits run $100–$500 typically. Building without one can mean fines, forced teardown, and problems at home sale. Some jurisdictions exempt ground-level floating decks under 200 sq ft." }
        },
